
{% extends 'app.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <div class="card border-0 shadow rounded-4 text-center p-4 p-md-5">

                <div class="mb-3">
                    <i class="bi bi-check-circle-fill text-success"
                       style="font-size: 85px;"></i>
                </div>

                <h2 class="fw-bold text-success">
                    Order Successfully Placed!
                </h2>

                <p class="text-muted mt-3">
                    Thank you for shopping with Gadget Galaxy.
                    Your order has been received successfully.
                </p>

                <div class="bg-light rounded-3 p-3 my-3">
                    <h5 class="mb-1">
                        Order #{{ order.id }}
                    </h5>

                    <p class="text-muted mb-0">
                        Total Amount: ₹{{ order.total_amount }}
                    </p>
                </div>

                <p class="text-muted">
                    Redirecting to My Orders in
                    <strong><span id="countdown">3</span> seconds...</strong>
                </p>

                <div class="progress mb-4" style="height: 7px;">
                    <div id="redirectProgress"
                         class="progress-bar bg-success"
                         style="width: 0%;">
                    </div>
                </div>

                <a href="{% url 'my_orders' %}"
                   class="btn btn-primary px-4">
                    View My Orders
                </a>

            </div>

        </div>
    </div>

</div>

<script>
    let seconds = 3;

    const countdown = document.getElementById('countdown');
    const progress = document.getElementById('redirectProgress');

    const timer = setInterval(function () {

        seconds--;

        countdown.textContent = seconds;
        progress.style.width = ((3 - seconds) / 3 * 100) + '%';

        if (seconds <= 0) {
            clearInterval(timer);
            window.location.href = "{% url 'my_orders' %}";
        }

    }, 1000);
</script>

{% endblock %}
