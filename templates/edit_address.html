
{% extends 'app.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow border-0 rounded-4">

                <div class="card-body p-4 p-md-5">

                    <h2 class="text-center mb-4">
                        <i class="bi bi-pencil-square text-primary"></i>
                        Edit Saved Address
                    </h2>

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            <label class="form-label">
                                Address Type
                            </label>

                            <select
                                name="address_type"
                                class="form-select"
                            >

                                <option
                                    value="home"
                                    {% if address.address_type == 'home' %}selected{% endif %}
                                >
                                    Home
                                </option>

                                <option
                                    value="work"
                                    {% if address.address_type == 'work' %}selected{% endif %}
                                >
                                    Work
                                </option>

                                <option
                                    value="other"
                                    {% if address.address_type == 'other' %}selected{% endif %}
                                >
                                    Other
                                </option>

                            </select>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Full Name
                            </label>

                            <input
                                type="text"
                                name="full_name"
                                class="form-control"
                                value="{{ address.full_name }}"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Phone Number
                            </label>

                            <input
                                type="tel"
                                name="phone"
                                class="form-control"
                                value="{{ address.phone }}"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label class="form-label">
                                Full Address
                            </label>

                            <textarea
                                name="address"
                                class="form-control"
                                rows="3"
                                required
                            >{{ address.address }}</textarea>

                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    City
                                </label>

                                <input
                                    type="text"
                                    name="city"
                                    class="form-control"
                                    value="{{ address.city }}"
                                    required
                                >

                            </div>

                            <div class="col-md-6 mb-3">

                                <label class="form-label">
                                    State
                                </label>

                                <input
                                    type="text"
                                    name="state"
                                    class="form-control"
                                    value="{{ address.state }}"
                                    required
                                >

                            </div>

                        </div>

                        <div class="mb-4">

                            <label class="form-label">
                                PIN Code
                            </label>

                            <input
                                type="text"
                                name="pincode"
                                class="form-control"
                                value="{{ address.pincode }}"
                                maxlength="6"
                                required
                            >

                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg w-100"
                        >

                            <i class="bi bi-check-circle"></i>
                            Update Address

                        </button>

                        <a
                            href="{% url 'saved_addresses' %}"
                            class="btn btn-outline-secondary w-100 mt-2"
                        >

                            Cancel

                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
