
{% extends 'app.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-dark text-white py-3">
                    <h4 class="mb-0">
                        <i class="bi bi-geo-alt"></i>
                        Add New Address
                    </h4>
                </div>

                <div class="card-body p-4">

                    {% if error %}
                        <div class="alert alert-danger">
                            {{ error }}
                        </div>
                    {% endif %}

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">
                                Address Type
                            </label>

                            <select name="address_type"
                                    class="form-select"
                                    required>
                                <option value="home">Home</option>
                                <option value="office">Office</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Full Name
                            </label>

                            <input type="text"
                                   name="full_name"
                                   class="form-control"
                                   maxlength="150"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Phone Number
                            </label>

                            <input type="tel"
                                   name="phone"
                                   class="form-control"
                                   maxlength="15"
                                   pattern="[0-9]{10,15}"
                                   title="Enter a phone number containing 10 to 15 digits."
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                Full Address
                            </label>

                            <textarea name="address"
                                      class="form-control"
                                      rows="3"
                                      required></textarea>
                        </div>

                        <div class="row">

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    City
                                </label>

                                <input type="text"
                                       name="city"
                                       class="form-control"
                                       maxlength="100"
                                       required>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label">
                                    State
                                </label>

                                <input type="text"
                                       name="state"
                                       class="form-control"
                                       maxlength="100"
                                       required>
                            </div>

                        </div>

                        <div class="mb-3">
                            <label class="form-label">
                                PIN Code
                            </label>

                            <input type="text"
                                   name="pincode"
                                   class="form-control"
                                   maxlength="10"
                                   pattern="[0-9]{6}"
                                   title="Enter a valid 6-digit Indian PIN code."
                                   required>
                        </div>

                        <div class="form-check mb-4">
                            <input type="checkbox"
                                   name="is_default"
                                   class="form-check-input"
                                   id="is_default">

                            <label class="form-check-label"
                                   for="is_default">
                                Set as my default delivery address
                            </label>
                        </div>

                        <div class="d-flex gap-2">

                            <button type="submit"
                                    class="btn btn-danger">
                                <i class="bi bi-save"></i>
                                Save Address
                            </button>

                            <a href="{% url 'saved_addresses' %}"
                               class="btn btn-outline-secondary">
                                Cancel
                            </a>

                        </div>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
